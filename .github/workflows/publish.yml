name: Publish

# npm trusted publishing (OIDC): no NPM_TOKEN. The first version is published
# once by hand, then the trusted publisher is configured on npmjs.com for this
# repository and workflow file (see the npm-oidc-publish skill).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json $VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      # Trusted publishing needs npm >= 11.5.1 (Node 24 ships it). Provenance
      # is attached automatically when npm publishes through OIDC.
      - run: npm --version
      - run: npm publish
