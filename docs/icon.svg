    <ellipse cx="438" cy="338" rx="26" ry="34"/>
    <circle cx="430" cy="294" r="22"/>
    <path d="M420 280 L 418 252 L 436 274 Z"/>
    <path d="M434 276 L 444 250 L 448 280 Z"/>
    <ellipse cx="410" cy="300" rx="12" ry="9"/>
