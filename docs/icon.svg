<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="main"><path d="M276 70 L 276 352 L 404 352 Z"/></clipPath>
    <clipPath id="jib"><path d="M262 92 L 262 352 L 168 352 Z"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#002058"/>
  <!-- sun -->
  <g fill="#FDBB15" stroke="#FDBB15" stroke-width="14" stroke-linecap="round">
    <circle cx="78" cy="96" r="40" stroke="none"/>
    <line x1="78" y1="28" x2="78" y2="18"/><line x1="78" y1="164" x2="78" y2="174"/>
    <line x1="10" y1="96" x2="20" y2="96"/><line x1="136" y1="96" x2="146" y2="96"/>
    <line x1="30" y1="48" x2="37" y2="55"/><line x1="119" y1="137" x2="126" y2="144"/>
    <line x1="30" y1="144" x2="37" y2="137"/><line x1="119" y1="55" x2="126" y2="48"/>
  </g>
  <!-- energy blowing from the sun into the sails like wind -->
  <g fill="none" stroke="#FDBB15" stroke-width="14" stroke-linecap="round">
    <path d="M156 150 C 182 134 202 166 230 150"/>
    <path d="M112 200 C 150 180 170 220 208 200"/>
    <path d="M130 250 C 160 236 174 262 194 252"/>
  </g>
  <!-- mast -->
  <rect x="263" y="56" width="12" height="310" fill="#FFFFFF"/>
  <!-- sails as solar panels -->
  <path d="M276 70 L 276 352 L 404 352 Z" fill="#FFFFFF"/>
  <path d="M262 92 L 262 352 L 168 352 Z" fill="#FFFFFF"/>
  <g stroke="#002058" stroke-width="7">
    <g clip-path="url(#main)">
      <line x1="270" y1="146" x2="430" y2="146"/><line x1="270" y1="216" x2="430" y2="216"/><line x1="270" y1="286" x2="430" y2="286"/>
      <line x1="324" y1="60" x2="324" y2="360"/><line x1="372" y1="60" x2="372" y2="360"/>
    </g>
    <g clip-path="url(#jib)">
      <line x1="160" y1="160" x2="270" y2="160"/><line x1="160" y1="226" x2="270" y2="226"/><line x1="160" y1="292" x2="270" y2="292"/>
      <line x1="214" y1="80" x2="214" y2="360"/>
    </g>
  </g>
  <!-- hull -->
  <path fill="#FDBB15" d="M120 372 L 488 372 C 470 420 440 446 400 446 L 184 446 C 156 446 134 418 120 372 Z"/>
